# DiT-DMF CA-iMF (CAMF) pure-adversarial post-training config.
# Cloned from caltech_sit_meft_caimf_posttrain_config.yml. The ONLY substantive
# differences from the SiT template are the model block (DiT-DMF uses the
# ddpm-v / dit_native target mapping + the flipped/scaled native timestep
# convention) and the sampling block (DiT MF-A operating point: omega=1.5,
# t in [0,1]). Backbone class is shared (imfDiT_DMF_XL_2 = imfSiT_DMF_XL_2), so
# the SiT-MeFT discriminator + adversarial forward apply unchanged.
dataset:
    root: data/caltech-101_processed_latents
    image_size: 32
    image_channels: 4
    vae: mse
    name: caltech101_latent
    num_classes: 101
    num_classes_from_data: True
    num_workers: 4
    prefetch_factor: 2
    pin_memory: True

model:
    model_str: imfDiT_DMF_XL_2
    num_classes: 101
    training_mode: imf_jvp
    target_use_null_class: True
    use_auxiliary_v_head: False
    use_dogfit: False
    class_dropout_prob: 0.1
    cfg_beta: 1.0
    # --- guidance operating point (DiT MF-A: fixed omega=1.5) ---
    guidance_scale_strategy: fixed
    fixed_guidance_scale: 1.5
    use_training_guidance: True
    training_guidance_interval_strategy: fixed
    training_guidance_t_min: 0.0
    training_guidance_t_max: 1.0
    training_guidance_start_step: 0
    use_context_guidance_conditioning: False
    use_adaln_guidance_scale_conditioning: False
    adaln_guidance_scale_init: timestep
    use_adaln_condition_mixing: False
    decoder_only_guidance_conditioning: False
    # --- DMF split-time convention (same _DMF gate as SiT) ---
    time_conditioning_mode: split
    # --- DDPM-v (dit_native) TARGET mapping: predict noise, map to velocity ---
    target_output_prediction_space: noise
    target_velocity_map_mode: dit_native
    target_native_beta_schedule: linear
    target_native_diffusion_steps: 1000
    target_native_velocity_derivative_mode: finite_difference
    target_wrapper_eps: 0.001
    target_input_alignment_mode: none
    # --- TIMESTEP CONVENTION mapping: DiT native step runs 0..999, flipped ---
    target_model_time_flip: True
    target_model_time_scale: 999.0
    # --- source side (v-space teacher), unused for pure-adversarial but kept for parity ---
    source_prediction_space: v
    source_velocity_map_mode: transport
    source_native_beta_schedule: linear
    source_native_diffusion_steps: 1000
    source_native_velocity_derivative_mode: finite_difference

caimf:
    lambda_imf: 0.0
    lambda_adv: 1.0
    lambda_ot: 0.0
    lambda_cp: 0.001
    interval_eps: 0.001
    gen_learning_rate: 0.00001
    dis_learning_rate: 0.00001
    adam_beta1: 0.0
    adam_beta2: 0.95
    weight_decay: 0.0
    discriminator_warmup_batches: 5000
    discriminator_steps_per_cycle: 4
    discriminator_updates: True
    freeze_discriminator_backbone: False
    load_generator_ema: False
    max_posttrain_batches: 150000

training:
    num_epochs: 1000
    batch_size: 2
    grad_accum_steps: 1
    use_ema: True
    ema_val: 0.9999
    log_per_step: 100
    checkpoint_per_epoch: 1
    sample_per_step: 5000
    preview_num_steps: [1, 2, 4]
    preview_num_images: 16
    fid_per_step: 0
    fid_schedule:
        - from_step: 5000
          every_steps: 5000
    metric_num_steps: [4]
    save_best_fid_only: True
    save_best_fid_eval_state_only: True
    best_fid_checkpoint_dir: best_fid
    save_eval_checkpoint_per_fid: False
    eval_checkpoint_dir: latest_eval
    seed: 42

fid:
    cache_ref: stats/caltech-101-fid_stats.npz
    device_batch_size: 1
    sample_device_batch_size: 1
    sample_log_every: 25
    num_samples: 10000

fd_dino:
    arch: vitb14
    cache_ref: stats/caltech-101-fd_dino-vitb14_stats.npz

sampling:
    num_classes: 101
    num_steps: 4
    omega: 1.5
    t_min: 0.0
    t_max: 1.0

logging:
    use_wandb: False
    wandb_project: caimf_dit_meft
    wandb_name: caltech_dit_meft_caimf
    wandb_entity: ""
    wandb_tags: [caltech101, dit-meft, caimf, posttrain]

load_from: ""
partial_load: True
